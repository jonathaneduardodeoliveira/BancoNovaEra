<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco Nova Era - Cadastro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card p-4 shadow">
          <h2 class="text-center mb-4">Criar Conta</h2>
          <form id="registerForm">
            <div class="mb-3">
              <label for="nome" class="form-label">Nome completo</label>
              <input type="text" id="nome" class="form-control" placeholder="Digite seu nome" required>
            </div>
            <div class="mb-3">
              <label for="cpf" class="form-label">CPF</label>
              <input type="text" id="cpf" class="form-control" placeholder="Digite seu CPF" required>
            </div>
            <div class="mb-3">
              <label for="senha" class="form-label">Senha</label>
              <input type="password" id="senha" class="form-control" placeholder="Digite sua senha" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Cadastrar</button>
          </form>
          <div id="registerMessage" class="mt-3 text-center"></div>
          <div class="text-center mt-3">
            <a href="../index.html">Já tenho conta</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("registerForm");
      const messageDiv = document.getElementById("registerMessage");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const nome = document.getElementById("nome").value.trim();
        const cpf = document.getElementById("cpf").value.trim();
        const senha = document.getElementById("senha").value.trim();

        try {
          const response = await fetch("http://localhost:8080/usuarios", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ nome, cpf, senha })
          });

          if (response.ok) {
            const data = await response.json();
            const contaNumero = data.numeroConta || "(não retornado)";

            alert("Conta criada com sucesso!\nNúmero da conta: " + contaNumero);

            window.location.href = "../index.html";
          } else {
            const text = await response.text();
            messageDiv.innerHTML = `<span class='text-danger'>${text}</span>`;
          }
        } catch (error) {
          messageDiv.innerHTML = "<span class='text-danger'>Erro ao conectar com o servidor.</span>";
        }
      });
    });
  </script>
</body>
</html>
