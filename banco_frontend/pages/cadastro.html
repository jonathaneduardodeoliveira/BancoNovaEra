
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Banco Nova Era</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2 class="text-center">Banco Nova Era</h2>
    <div class="card p-4 mx-auto mt-3" style="max-width:400px;">
      <h4 class="text-center mb-3">Cadastro</h4>
      <form id="cadastroForm">
        <div class="mb-3">
          <label class="form-label">Nome</label>
          <input type="text" class="form-control" id="name" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Endereço</label>
          <input type="text" class="form-control" id="address" required>
        </div>
        <div class="mb-3">
          <label class="form-label">CPF</label>
          <input type="text" class="form-control" id="cpf" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input type="password" class="form-control" id="newPassword" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Cadastrar</button>
      </form>
      <p class="text-center mt-3"><a href="../index.html">Voltar ao Login</a></p>
    </div>
  </div>
<script src="../js/script.js"></script>
</body>
</html>
