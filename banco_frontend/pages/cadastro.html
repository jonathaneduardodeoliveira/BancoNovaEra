<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro - Banco Nova Era</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="container mt-5">
    <h2 class="text-center" id="titulo-principal">Banco Nova Era</h2>
    <div class="card p-4 mx-auto mt-3" style="max-width: 600px;" role="form" aria-labelledby="titulo-principal">
      <h4 class="text-center mb-3">Cadastro</h4>
      <form id="cadastroForm" aria-label="Formulário de Cadastro">
        <div class="mb-3">
          <label for="name" class="form-label">Nome</label>
          <input type="text" class="form-control" id="name" name="nome" required aria-label="Nome completo" />
        </div>

        <div class="mb-3">
          <label for="cpf" class="form-label">CPF</label>
          <input type="text" class="form-control" id="cpf" name="cpf" required placeholder="000.000.000-00" aria-label="CPF no formato 000.000.000-00" />
        </div>

        <div class="mb-3">
          <label for="newPassword" class="form-label">Senha</label>
          <input type="password" class="form-control" id="newPassword" name="senha" required aria-label="Senha de acesso" />
        </div>

        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirmar Senha</label>
          <input type="password" class="form-control" id="confirmPassword" name="confirmarSenha" required aria-label="Confirmação da senha" />
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" class="form-control" id="email" name="email" required placeholder="seu@email.com" aria-label="E-mail válido" />
        </div>

        <div class="mb-3">
          <label for="telefone" class="form-label">Telefone</label>
          <input type="tel" class="form-control" id="telefone" name="telefone" required placeholder="(11) 90000-0000" aria-label="Número de telefone com DDD" />
        </div>

        <h5 class="text-center mt-4">Endereço</h5>

        <div class="mb-3">
          <label for="cep" class="form-label">CEP</label>
          <div class="input-group">
            <input type="text" class="form-control" id="cep" name="cep" placeholder="Digite o CEP" aria-label="Digite seu CEP com 8 números" />
            <button type="button" class="btn btn-outline-secondary" id="fill-address-btn" aria-label="Buscar endereço pelo CEP">Buscar</button>
          </div>
        </div>

        <div class="mb-3">
          <label for="logradouro" class="form-label">Endereço</label>
          <input type="text" class="form-control" id="logradouro" name="logradouro" placeholder="Rua, avenida..." aria-label="Logradouro do endereço" />
        </div>

        <div class="mb-3">
          <label for="bairro" class="form-label">Bairro</label>
          <input type="text" class="form-control" id="bairro" name="bairro" placeholder="Bairro" aria-label="Bairro" />
        </div>

        <div class="mb-3">
          <label for="cidade" class="form-label">Cidade</label>
          <input type="text" class="form-control" id="cidade" name="cidade" placeholder="Cidade" aria-label="Cidade" />
        </div>

        <div class="mb-3">
          <label for="uf" class="form-label">UF</label>
          <input type="text" class="form-control" id="uf" name="uf" placeholder="UF" aria-label="Estado ou unidade federativa, como SP ou RJ" />
        </div>

        <div class="mb-3">
          <label for="numero" class="form-label">Número</label>
          <input type="text" class="form-control" id="numero" name="numero" placeholder="Número" required aria-label="Número do imóvel" />
        </div>

        <div class="mb-3">
          <label for="complemento" class="form-label">Complemento</label>
          <input type="text" class="form-control" id="complemento" name="complemento" placeholder="Complemento" aria-label="Complemento do endereço, como bloco ou apartamento" />
        </div>

        <button type="submit" class="btn btn-success w-100" aria-label="Botão para enviar o formulário de cadastro">Cadastrar</button>
      </form>

      <p class="text-center mt-3"><a href="../index.html" aria-label="Voltar para a tela de login">Voltar ao Login</a></p>
    </div>
  </div>

  <footer class="text-center mt-4" role="contentinfo">
    <p>Desenvolvido por Jonathan Eduardo de Oliveira</p>
    <p>Email: jonathan.mega2@gmail.com</p>
  </footer>

  <script>
    document.getElementById("fill-address-btn").addEventListener("click", function () {
      const cep = document.getElementById("cep").value.replace(/\D/g, "");

      if (cep.length !== 8) {
        alert("CEP inválido. Digite 8 números.");
        return;
      }

      fetch(`https://viacep.com.br/ws/${cep}/json/`)
        .then(response => {
          if (!response.ok) throw new Error("Erro ao buscar CEP.");
          return response.json();
        })
        .then(data => {
          if (data.erro) {
            alert("CEP não encontrado.");
            return;
          }
          document.getElementById("logradouro").value = data.logradouro;
          document.getElementById("bairro").value = data.bairro;
          document.getElementById("cidade").value = data.localidade;
          document.getElementById("uf").value = data.uf;
        })
        .catch(error => {
          alert("Erro ao buscar endereço: " + error.message);
        });
    });
  </script>
</body>
</html>
