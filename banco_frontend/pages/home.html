<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco Digital - Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="./home.html">Banco nova Era</a>
      <div class="d-flex">
        <span class="navbar-text text-white me-3">
          Conta: <span id="accountDisplay"></span>
        </span>
        <span class="navbar-text text-white">
          Saldo: R$ <span id="balanceDisplay"></span>
        </span>
        <a href="../index.html" class="btn btn-danger btn-sm ms-3">Sair</a>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <h2 class="text-center mb-4">Bem-vindo ao Banco Digital</h2>
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="d-grid gap-3">
          <a href="deposito.html" class="btn btn-success btn-lg">Depósito</a>
          <a href="transferencia.html" class="btn btn-warning btn-lg">Transferência</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Importando Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Script para carregar saldo dinâmico -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const account = params.get("account");
      const usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];
      const user = usuarios.find(u => u.conta === account);

      if (!user) {
        alert("Conta não encontrada!");
        window.location.href = "../index.html";
        return;
      }

      // Exibe os dados do usuário
      document.getElementById("accountDisplay").textContent = user.conta;
      document.getElementById("balanceDisplay").textContent = user.saldo.toFixed(2);

      // Atualiza o saldo dinamicamente a cada 1 segundo
      setInterval(() => {
        const usuariosAtualizados = JSON.parse(localStorage.getItem("usuarios")) || [];
        const userAtualizado = usuariosAtualizados.find(u => u.conta === account);
        if (userAtualizado) {
          document.getElementById("balanceDisplay").textContent = userAtualizado.saldo.toFixed(2);
        }
      }, 1000);
    });
  </script>
</body>
</html>
